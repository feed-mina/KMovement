name: Seal Hostinger F4 TourAPI secret

"on":
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character origin/main SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1

      - name: Require the exact main SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Verify and encrypt the TourAPI key for this VPS only
        shell: bash
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TOUR_API_KEY"
          umask 077
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --get \
            --data-urlencode "serviceKey=${TOUR_API_KEY}" \
            --data-urlencode 'MobileOS=ETC' \
            --data-urlencode 'MobileApp=Kride' \
            --data-urlencode '_type=json' \
            --data-urlencode 'numOfRows=1' \
            --data-urlencode 'pageNo=1' \
            'https://apis.data.go.kr/B551011/KorService2/areaCode2')"
          python3 - "$response_file" "$status" <<'PY'
          import json
          import sys

          path, status = sys.argv[1:]
          if status != "200":
              print(f"::error::TourAPI preflight failed: HTTP {status}")
              raise SystemExit(1)
          try:
              with open(path, encoding="utf-8") as stream:
                  body = json.load(stream)
              result_code = body["response"]["header"]["resultCode"]
          except (KeyError, TypeError, ValueError, json.JSONDecodeError):
              print("::error::TourAPI preflight returned an invalid contract")
              raise SystemExit(1)
          if result_code != "0000":
              print(f"::error::TourAPI preflight failed: resultCode={result_code}")
              raise SystemExit(1)
          print("TourAPI preflight passed")
          PY
          rm -f "$response_file"

          public_key=deploy/hostinger/f4-recipient-public.pem
          openssl pkey -pubin -in "$public_key" -noout
          printf '%s' "$TOUR_API_KEY" | openssl pkeyutl -encrypt \
            -pubin -inkey "$public_key" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out tour_api_key.enc
          test -s tour_api_key.enc
          sha256sum tour_api_key.enc | sed 's/ .*$/  tour_api_key.enc/' \
            > tour_api_key.enc.sha256

      - name: Upload the one-time encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: f4-tour-secret-${{ inputs.expected_main_sha }}
          path: |
            tour_api_key.enc
            tour_api_key.enc.sha256
          if-no-files-found: error
          retention-days: 1
