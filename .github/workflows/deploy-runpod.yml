name: Build & Push RunPod Media Worker

on:
  push:
    branches: ["main"]
    paths:
      # 두 RunPod 워크플로가 같은 경로로 트리거되면 한쪽 이미지에만 해당하는
      # 변경에도 대형 이미지 2개가 모두 빌드된다. 공유 파이썬 소스는 양쪽 다
      # 빌드해야 하므로 유지하고, Tora 전용 입력만 제외한다.
      - "deploy/media_motion/**"
      - "!deploy/media_motion/Dockerfile.tora"
      - "!deploy/media_motion/requirements-tora.txt"
      - "!deploy/media_motion/tora_entrypoint.sh"
  workflow_dispatch:

concurrency:
  group: runpod-media-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/kride-media-gpu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/media_motion/Dockerfile.runpod
          push: true
          cache-from: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:latest
          cache-to: type=inline
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.sha_short }}

      - name: Summary
        run: |
          echo "## RunPod Media Worker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** \`${{ env.DOCKERHUB_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "RunPod 엔드포인트에서 이 이미지를 사용하세요." >> $GITHUB_STEP_SUMMARY
