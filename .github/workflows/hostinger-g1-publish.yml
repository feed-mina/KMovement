name: Publish Hostinger G1 Spring image

"on":
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character origin/main SHA to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: hostinger-g1-spring-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1

      - name: Require the current main SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the exact main image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: subproject/SDUI/SDUI-server
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/feed-mina/kmovement-spring:${{ inputs.expected_main_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/feed-mina/KMovement
            org.opencontainers.image.revision=${{ inputs.expected_main_sha }}

      - name: Verify and record the immutable image
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/feed-mina/kmovement-spring@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image"
          {
            echo "## Hostinger G1 Spring image"
            echo
            echo "- main SHA: \`$EXPECTED_MAIN_SHA\`"
            echo "- immutable image: \`$image\`"
            echo "- deployment: not performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
