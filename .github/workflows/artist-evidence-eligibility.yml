name: Artist evidence and visit eligibility
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: policy_test
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: policy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U policy_test -d policy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KRIDE_POLICY_TEST_DSN: postgresql://policy_test:local-ci-fixture@localhost:5432/policy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2,<3' 'httpx>=0.27,<1' 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest tests.test_recommendation_policy tests.test_artist_evidence_postgres -v
