name: Seal Hostinger F2 Kakao secret

"on":
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character origin/main SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1

      - name: Require the exact main SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Verify and encrypt the Kakao REST key for this VPS only
        shell: bash
        env:
          KAKAO_LOCAL_REST_API_KEY: ${{ secrets.KAKAO_CLIENT_ID }}
        run: |
          set -euo pipefail
          test -n "$KAKAO_LOCAL_REST_API_KEY"
          umask 077
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --get \
            --data-urlencode 'query=테헤란로 152' \
            --header "Authorization: KakaoAK ${KAKAO_LOCAL_REST_API_KEY}" \
            'https://dapi.kakao.com/v2/local/search/address.json')"
          python3 - "$response_file" "$status" <<'PY'
          import json
          import sys

          path, status = sys.argv[1:]
          with open(path, encoding="utf-8") as stream:
              body = json.load(stream)
          if status != "200":
              error_type = body.get("errorType") or body.get("code") or "unknown"
              print(f"::error::Kakao Local API preflight failed: HTTP {status}, type={error_type}")
              raise SystemExit(1)
          if not isinstance(body.get("documents"), list):
              print("::error::Kakao Local API preflight returned an invalid contract")
              raise SystemExit(1)
          print("Kakao Local API preflight passed")
          PY
          rm -f "$response_file"

          public_key=deploy/hostinger/f2-recipient-public.pem
          openssl pkey -pubin -in "$public_key" -noout
          printf '%s' "$KAKAO_LOCAL_REST_API_KEY" | openssl pkeyutl -encrypt \
            -pubin -inkey "$public_key" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out kakao_rest_api_key.enc
          test -s kakao_rest_api_key.enc
          sha256sum kakao_rest_api_key.enc | sed 's/ .*$/  kakao_rest_api_key.enc/' \
            > kakao_rest_api_key.enc.sha256

      - name: Upload the one-time encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: f2-kakao-secret-${{ inputs.expected_main_sha }}
          path: |
            kakao_rest_api_key.enc
            kakao_rest_api_key.enc.sha256
          if-no-files-found: error
          retention-days: 1
