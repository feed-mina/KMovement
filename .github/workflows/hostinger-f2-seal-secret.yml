name: Seal Hostinger F2 Kakao secret

"on":
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character origin/main SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1

      - name: Require the exact main SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Encrypt the Kakao REST key for this VPS only
        shell: bash
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$KAKAO_REST_API_KEY"
          umask 077
          public_key=deploy/hostinger/f2-recipient-public.pem
          openssl pkey -pubin -in "$public_key" -noout
          printf '%s' "$KAKAO_REST_API_KEY" | openssl pkeyutl -encrypt \
            -pubin -inkey "$public_key" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out kakao_rest_api_key.enc
          test -s kakao_rest_api_key.enc
          sha256sum kakao_rest_api_key.enc | sed 's/ .*$/  kakao_rest_api_key.enc/' \
            > kakao_rest_api_key.enc.sha256

      - name: Upload the one-time encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: f2-kakao-secret-${{ inputs.expected_main_sha }}
          path: |
            kakao_rest_api_key.enc
            kakao_rest_api_key.enc.sha256
          if-no-files-found: error
          retention-days: 1
