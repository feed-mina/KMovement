name: Publish Hostinger web image

"on":
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character source branch SHA to publish
        required: true
        type: string
      source_ref:
        description: Branch to publish (main by default; release branches do not trigger EC2 deployment)
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: hostinger-web-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1

      - name: Require the current source branch SHA and required public build value
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$KAKAO_MAP_APP_KEY"
          git check-ref-format --branch "$SOURCE_REF"
          git fetch --no-tags --depth=1 origin "refs/heads/$SOURCE_REF"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_MAIN_SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the exact release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: subproject/SDUI/metadata-project
          platforms: linux/amd64
          pull: true
          push: true
          tags: ghcr.io/feed-mina/kmovement-web:${{ inputs.expected_main_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/feed-mina/KMovement
            org.opencontainers.image.revision=${{ inputs.expected_main_sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://kmovement.srv1869569.hstgr.cloud
            NEXT_PUBLIC_BACKEND_URL=http://spring:8080
            FASTAPI_URL=http://fastapi:8000
            NEXT_PUBLIC_KAKAO_MAP_APP_KEY=${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}

      - name: Verify and record the immutable image
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/feed-mina/kmovement-web@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image"
          {
            echo "## Hostinger web image"
            echo
            echo "- release SHA: \`$EXPECTED_MAIN_SHA\`"
            echo "- immutable image: \`$image\`"
            echo "- target: \`kmovement.srv1869569.hstgr.cloud\`"
            echo "- deployment: not performed by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
