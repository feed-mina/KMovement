name: Itinerary request contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/**'
      - 'tests/test_itinerary_*.py'
      - 'subproject/SDUI/metadata-project/**'
      - '.github/workflows/itinerary-contract.yml'

permissions:
  contents: read

jobs:
  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2,<3' 'httpx>=0.27,<1' 'pytest>=8,<9'
      - run: python -m pytest tests/test_itinerary_request_contract.py tests/test_itinerary_policy_unit.py -q


  frontend-directions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: subproject/SDUI/metadata-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: subproject/SDUI/metadata-project/package-lock.json
      - run: npm ci
      - name: Check consent, unsupported conditions and address-first directions
        run: >-
          npx jest --runInBand
          tests/components/RouteScreen.test.tsx
          tests/components/RoadRoutePlanner.test.tsx
          tests/services/directions.test.ts
          tests/hooks/itineraryRequestContract.test.ts
          tests/hooks/krideItinerarySources.test.ts
          tests/components/RouteMap.test.tsx
          --reporters=default
      - name: Type check
        run: npx tsc --noEmit --incremental false
      - name: Lint changed directions components
        run: >-
          npx eslint
          components/plugins/travel/RouteScreen.tsx
          components/plugins/travel/RoadRoutePlanner.tsx
          lib/kride/directions.ts
