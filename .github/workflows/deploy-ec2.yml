name: Deploy K-Ride services to EC2

on:
  push:
    branches: ["main"]
    paths:
      - "subproject/SDUI/SDUI-server/**"
      - "subproject/SDUI/metadata-project/**"
      - "src/api/**"
      - "Dockerfile.worker"
      - "deploy/ec2/**"
      - "deploy/media_motion/**"
      - "dataset/data/raw_ml/road_scored.csv"
      - "dataset/data/raw_ml/facility_clean.csv"
      - "dataset/data/raw_ml/tour_poi.csv"
      - "dataset/models/route_graph.pkl"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      cleanup_logs_and_caches:
        description: "Fail the deploy if approved log/cache cleanup cannot reach the 4GiB floor"
        required: true
        default: false
        type: boolean

concurrency:
  group: ec2-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  KRIDE_FASTAPI_URL: ${{ vars.KRIDE_FASTAPI_URL || 'http://kride-fastapi:8000' }}
  KRIDE_FASTAPI_HOST_URL: ${{ vars.KRIDE_FASTAPI_HOST_URL || 'http://127.0.0.1:8000' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate FastAPI endpoint config
        run: |
          if [ -z "$KRIDE_FASTAPI_URL" ]; then
            echo "::error::Set KRIDE_FASTAPI_URL or use the default AWS internal FastAPI URL."
            exit 1
          fi
          if [ "$KRIDE_FASTAPI_URL" = "https://kmovement-46122739597.europe-west1.run.app" ]; then
            echo "::error::KRIDE_FASTAPI_URL still points at the legacy Cloud Run service. Use AWS internal FastAPI."
            exit 1
          fi
          if [ -z "$KRIDE_FASTAPI_HOST_URL" ]; then
            echo "::error::Set KRIDE_FASTAPI_HOST_URL or use the default http://127.0.0.1:8000."
            exit 1
          fi

      # ── Detect what changed ──
      - name: Detect changed paths
        id: changes
        run: |
          DEPLOY_BACKEND="false"
          DEPLOY_FRONTEND="false"
          DEPLOY_FASTAPI="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_BACKEND="true"
            DEPLOY_FRONTEND="true"
            DEPLOY_FASTAPI="true"
          else
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} || echo "")
            # fetch-depth 2 로는 squash merge 등에서 before 커밋이 없어 diff 가
            # 비는 경우가 있다. 그때 조용히 아무것도 배포하지 않으면 워크플로가
            # 성공으로 끝나면서 실제로는 배포가 누락된다. paths 필터가 이미
            # 관련 변경을 보장하므로 전체 배포로 fallback 한다.
            if [ -z "$CHANGED" ]; then
              echo "::warning::Could not resolve changed files from ${{ github.event.before }}; deploying all services."
              echo "backend=true"  >> $GITHUB_OUTPUT
              echo "frontend=true" >> $GITHUB_OUTPUT
              echo "fastapi=true"  >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "$CHANGED" | grep -q '^subproject/SDUI/SDUI-server/' && DEPLOY_BACKEND="true"
            echo "$CHANGED" | grep -q '^subproject/SDUI/metadata-project/' && DEPLOY_FRONTEND="true"
            echo "$CHANGED" | grep -q '^src/api/' && DEPLOY_FASTAPI="true"
            echo "$CHANGED" | grep -Eq '^(Dockerfile\.worker|deploy/media_motion/)' && DEPLOY_FASTAPI="true"
            echo "$CHANGED" | grep -Eq '^(dataset/data/raw_ml/(road_scored|facility_clean|tour_poi)\.csv|dataset/models/route_graph\.pkl|\.dockerignore)' && DEPLOY_FASTAPI="true"
            # 배포 절차 자체가 바뀌면 서비스별 변경 여부와 무관하게 전부 다시
            # 올린다. deploy/ec2/ 는 워크플로 파일과 같은 취급이다. #210 에서
            # 스크립트를 파일로 뺐을 뿐, 호스트에서 도는 배포 절차라는 성격은
            # 그대로다.
            echo "$CHANGED" | grep -Eq '^(\.github/workflows/deploy-ec2\.yml|deploy/ec2/)' && { DEPLOY_BACKEND="true"; DEPLOY_FRONTEND="true"; DEPLOY_FASTAPI="true"; }
          fi
          echo "backend=$DEPLOY_BACKEND"  >> $GITHUB_OUTPUT
          echo "frontend=$DEPLOY_FRONTEND" >> $GITHUB_OUTPUT
          echo "fastapi=$DEPLOY_FASTAPI" >> $GITHUB_OUTPUT

      - name: Validate deployment credentials
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.fastapi == 'true' || steps.changes.outputs.frontend == 'true'
        env:
          SECRET_AWS_HOST: ${{ secrets.AWS_HOST }}
          SECRET_AWS_USERNAME: ${{ secrets.AWS_USERNAME }}
          SECRET_AWS_KEY: ${{ secrets.AWS_KEY }}
          SECRET_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SECRET_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          MISSING=""
          [ -n "$SECRET_AWS_HOST" ]        || MISSING="$MISSING AWS_HOST"
          [ -n "$SECRET_AWS_USERNAME" ]    || MISSING="$MISSING AWS_USERNAME"
          [ -n "$SECRET_AWS_KEY" ]         || MISSING="$MISSING AWS_KEY"
          [ -n "$SECRET_DOCKER_USERNAME" ] || MISSING="$MISSING DOCKER_USERNAME"
          [ -n "$SECRET_DOCKER_PASSWORD" ] || MISSING="$MISSING DOCKER_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required deployment secrets:$MISSING"
            exit 1
          fi

      - name: Validate Celery production secrets
        if: steps.changes.outputs.fastapi == 'true'
        env:
          INTERNAL_API_KEY: ${{ secrets.FASTAPI_INTERNAL_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -z "$INTERNAL_API_KEY" ]; then
            echo "::error::FASTAPI_INTERNAL_API_KEY must be configured for Celery status and SSE authentication."
            exit 1
          fi
          if [ -z "$CLOUDINARY_URL" ] && {
            [ -z "$CLOUDINARY_CLOUD_NAME" ] ||
            [ -z "$CLOUDINARY_API_KEY" ] ||
            [ -z "$CLOUDINARY_API_SECRET" ];
          }; then
            echo "::error::Configure CLOUDINARY_URL or all three individual Cloudinary credentials."
            exit 1
          fi
          for value in "$INTERNAL_API_KEY" "$CLOUDINARY_URL" "$CLOUDINARY_CLOUD_NAME" "$CLOUDINARY_API_KEY" "$CLOUDINARY_API_SECRET"; do
            if [[ "$value" == *"'"* || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::Celery deployment secrets must be single-line values without apostrophes."
              exit 1
            fi
          done

      - name: Validate backend deployment secrets
        if: steps.changes.outputs.backend == 'true'
        env:
          DEPLOY_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEPLOY_JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DEPLOY_MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          MISSING=""
          [ -n "$DEPLOY_DB_PASSWORD" ]    || MISSING="$MISSING DB_PASSWORD"
          [ -n "$DEPLOY_JWT_SECRET_KEY" ] || MISSING="$MISSING JWT_SECRET_KEY"
          [ -n "$DEPLOY_MAIL_PASSWORD" ]  || MISSING="$MISSING MAIL_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required backend secrets:$MISSING"
            exit 1
          fi
          NEWLINE_ERRORS=""
          for entry in "DB_PASSWORD:$DEPLOY_DB_PASSWORD" "JWT_SECRET_KEY:$DEPLOY_JWT_SECRET_KEY" "MAIL_PASSWORD:$DEPLOY_MAIL_PASSWORD"; do
            name="${entry%%:*}"
            value="${entry#*:}"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              NEWLINE_ERRORS="$NEWLINE_ERRORS $name"
            fi
          done
          if [ -n "$NEWLINE_ERRORS" ]; then
            echo "::error::Backend deployment secrets must be single-line values (no embedded newlines):$NEWLINE_ERRORS"
            exit 1
          fi

      # ── Backend build ──
      - name: Set up JDK 17
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        if: steps.changes.outputs.backend == 'true'
        run: chmod +x gradlew
        working-directory: ./subproject/SDUI/SDUI-server

      - name: Build Spring Boot
        if: steps.changes.outputs.backend == 'true'
        run: ./gradlew clean build -x test
        working-directory: ./subproject/SDUI/SDUI-server

      # ── Frontend build ──
      - name: Set up Node.js 20
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Image tags ──
      - name: Set image tags
        run: |
          CLEAN_BRANCH=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "BRANCH_TAG=$CLEAN_BRANCH" >> $GITHUB_ENV
          echo "SDUI_IMAGE=${{ secrets.DOCKER_USERNAME }}/sdui-app" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/sdui-frontend" >> $GITHUB_ENV
          echo "KRIDE_FASTAPI_IMAGE=${{ secrets.DOCKER_USERNAME }}/kride-fastapi" >> $GITHUB_ENV
          echo "KRIDE_CELERY_IMAGE=${{ secrets.DOCKER_USERNAME }}/kride-celery" >> $GITHUB_ENV
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_PORT=8080" >> $GITHUB_ENV
            echo "CONTAINER_NAME=sdui-backend" >> $GITHUB_ENV
            echo "DB_NAME=SDUI_TD" >> $GITHUB_ENV
          else
            echo "TARGET_PORT=8081" >> $GITHUB_ENV
            echo "CONTAINER_NAME=sdui-backend-lab" >> $GITHUB_ENV
            echo "DB_NAME=SDUI_LAB" >> $GITHUB_ENV
          fi

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push K-Ride FastAPI image
        if: steps.changes.outputs.fastapi == 'true'
        run: |
          docker build -f src/api/Dockerfile \
            -t $KRIDE_FASTAPI_IMAGE:${{ env.BRANCH_TAG }} \
            -t $KRIDE_FASTAPI_IMAGE:latest \
            .
          docker push $KRIDE_FASTAPI_IMAGE:${{ env.BRANCH_TAG }}
          docker push $KRIDE_FASTAPI_IMAGE:latest

      - name: Build and push K-Ride Celery image
        if: steps.changes.outputs.fastapi == 'true'
        run: |
          docker build -f Dockerfile.worker \
            -t $KRIDE_CELERY_IMAGE:${{ env.BRANCH_TAG }} \
            -t $KRIDE_CELERY_IMAGE:latest \
            .
          docker push $KRIDE_CELERY_IMAGE:${{ env.BRANCH_TAG }}
          docker push $KRIDE_CELERY_IMAGE:latest

      # ── Build & push backend image ──
      - name: Build and push Spring Boot image
        if: steps.changes.outputs.backend == 'true'
        run: |
          docker build -t $SDUI_IMAGE:${{ env.BRANCH_TAG }} -t $SDUI_IMAGE:latest ./subproject/SDUI/SDUI-server
          docker push $SDUI_IMAGE:${{ env.BRANCH_TAG }}
          docker push $SDUI_IMAGE:latest

      # ── Build & push frontend image ──
      - name: Build and push Next.js image
        if: steps.changes.outputs.frontend == 'true'
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=http://sdui-backend:8080 \
            --build-arg FASTAPI_URL="${{ env.KRIDE_FASTAPI_URL }}" \
            --build-arg NEXT_PUBLIC_KAKAO_MAP_APP_KEY="${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_VAPID_KEY="${{ secrets.FIREBASE_VAPID_KEY }}" \
            -t $FRONTEND_IMAGE:${{ env.BRANCH_TAG }} \
            -t $FRONTEND_IMAGE:latest \
            ./subproject/SDUI/metadata-project
          docker push $FRONTEND_IMAGE:${{ env.BRANCH_TAG }}
          docker push $FRONTEND_IMAGE:latest

      # ── SSH setup ──
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload GCP credentials to EC2
        run: |
          if [ -n "${{ secrets.GCP_CREDENTIALS_JSON }}" ]; then
            echo "${{ secrets.GCP_CREDENTIALS_JSON }}" | base64 -d > /tmp/gcp-credentials.json
          else
            echo "{}" > /tmp/gcp-credentials.json
          fi

          if [ -n "${{ secrets.FIREBASE_ADMINSDK_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_ADMINSDK_JSON }}" | base64 -d > /tmp/firebase-adminsdk.json
          else
            echo "{}" > /tmp/firebase-adminsdk.json
          fi

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/gcp-credentials.json /tmp/firebase-adminsdk.json ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }}:/home/ubuntu/

      # ── Create Nginx config ──
      - name: Write Host Nginx SSL config to EC2
        run: |
          # 설정 본문은 deploy/ec2/nginx.conf 에 있다. 워크플로 파일은 배포
          # 트리거에서 의도적으로 빠져 있어, 여기에 인라인으로 두면 설정만
          # 고쳤을 때 배포가 돌지 않는다(#228 이 그렇게 누락됐다).
          sed "s|__KRIDE_FASTAPI_HOST_URL__|${{ env.KRIDE_FASTAPI_HOST_URL }}|g" \
            deploy/ec2/nginx.conf \
            | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} \
              "sudo tee /etc/nginx/sites-available/yerin.duckdns.org > /dev/null"

      # ── Deploy script ──
      - name: Create deploy script
        env:
          DEPLOY_FASTAPI_INTERNAL_API_KEY: ${{ secrets.FASTAPI_INTERNAL_API_KEY }}
          DEPLOY_CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          DEPLOY_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          DEPLOY_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          DEPLOY_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          cp deploy/ec2/deploy.sh /tmp/deploy.sh

          escape_sed_replacement() {
            printf '%s' "$1" | sed 's/[&|\\]/\\&/g'
          }

          FASTAPI_INTERNAL_API_KEY_ESCAPED="$(escape_sed_replacement "$DEPLOY_FASTAPI_INTERNAL_API_KEY")"
          CLOUDINARY_URL_ESCAPED="$(escape_sed_replacement "$DEPLOY_CLOUDINARY_URL")"
          CLOUDINARY_CLOUD_NAME_ESCAPED="$(escape_sed_replacement "$DEPLOY_CLOUDINARY_CLOUD_NAME")"
          CLOUDINARY_API_KEY_ESCAPED="$(escape_sed_replacement "$DEPLOY_CLOUDINARY_API_KEY")"
          CLOUDINARY_API_SECRET_ESCAPED="$(escape_sed_replacement "$DEPLOY_CLOUDINARY_API_SECRET")"

          sed -i "s|__SDUI_IMAGE__|${{ env.SDUI_IMAGE }}|g" /tmp/deploy.sh
          sed -i "s|__FRONTEND_IMAGE__|${{ env.FRONTEND_IMAGE }}|g" /tmp/deploy.sh
          sed -i "s|__KRIDE_FASTAPI_IMAGE__|${{ env.KRIDE_FASTAPI_IMAGE }}|g" /tmp/deploy.sh
          sed -i "s|__KRIDE_CELERY_IMAGE__|${{ env.KRIDE_CELERY_IMAGE }}|g" /tmp/deploy.sh
          sed -i "s|__BRANCH_TAG__|${{ env.BRANCH_TAG }}|g" /tmp/deploy.sh
          sed -i "s|__CONTAINER_NAME__|${{ env.CONTAINER_NAME }}|g" /tmp/deploy.sh
          sed -i "s|__TARGET_PORT__|${{ env.TARGET_PORT }}|g" /tmp/deploy.sh
          sed -i "s|__DB_NAME__|${{ env.DB_NAME }}|g" /tmp/deploy.sh
          sed -i "s|__DB_USERNAME__|${{ secrets.DB_USERNAME }}|g" /tmp/deploy.sh
          sed -i "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" /tmp/deploy.sh
          sed -i "s|__MAIL_PASSWORD__|${{ secrets.MAIL_PASSWORD }}|g" /tmp/deploy.sh
          sed -i "s|__JWT_SECRET_KEY__|${{ secrets.JWT_SECRET_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__OPENAI_API_KEY__|${{ secrets.OPENAI_API_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__TOUR_API_KEY__|${{ secrets.TOUR_API_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__KAKAO_CLIENT_ID__|${{ secrets.KAKAO_CLIENT_ID }}|g" /tmp/deploy.sh
          sed -i "s|__KAKAO_REDIRECT_URI__|${{ secrets.KAKAO_REDIRECT_URI }}|g" /tmp/deploy.sh
          sed -i "s|__WEB_URL__|${{ secrets.WEB_URL }}|g" /tmp/deploy.sh
          sed -i "s|__S3_ACCESS_KEY__|${{ secrets.AWS_ACCESS_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__S3_SECRET_KEY__|${{ secrets.AWS_SECRET_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__KRIDE_FASTAPI_URL__|${{ env.KRIDE_FASTAPI_URL }}|g" /tmp/deploy.sh
          sed -i "s|__FASTAPI_INTERNAL_API_KEY__|$FASTAPI_INTERNAL_API_KEY_ESCAPED|g" /tmp/deploy.sh
          sed -i "s|__GROQ_API_KEY__|${{ secrets.GROQ_API_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__RUNPOD_API_KEY__|${{ secrets.RUNPOD_API_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__RUNPOD_ENDPOINT_ID__|${{ secrets.RUNPOD_ENDPOINT_ID }}|g" /tmp/deploy.sh
          sed -i "s|__RUNPOD_MEDIA_ENDPOINT_ID__|${{ secrets.RUNPOD_MEDIA_ENDPOINT_ID }}|g" /tmp/deploy.sh
          sed -i "s|__RUNPOD_TORA_ENDPOINT_ID__|${{ secrets.RUNPOD_TORA_ENDPOINT_ID }}|g" /tmp/deploy.sh
          sed -i "s|__CLOUDINARY_URL__|$CLOUDINARY_URL_ESCAPED|g" /tmp/deploy.sh
          sed -i "s|__CLOUDINARY_CLOUD_NAME__|$CLOUDINARY_CLOUD_NAME_ESCAPED|g" /tmp/deploy.sh
          sed -i "s|__CLOUDINARY_API_KEY__|$CLOUDINARY_API_KEY_ESCAPED|g" /tmp/deploy.sh
          sed -i "s|__CLOUDINARY_API_SECRET__|$CLOUDINARY_API_SECRET_ESCAPED|g" /tmp/deploy.sh
          sed -i "s|__GCP_PROJECT_ID__|${{ secrets.GCP_PROJECT_ID }}|g" /tmp/deploy.sh
          sed -i "s|__SLACK_WEBHOOK_URL__|${{ secrets.SLACK_WEBHOOK_URL }}|g" /tmp/deploy.sh
          sed -i "s|__SLACK_BOT_TOKEN__|${{ secrets.SLACK_BOT_TOKEN }}|g" /tmp/deploy.sh
          sed -i "s|__SLACK_CHANNEL_ID__|${{ secrets.SLACK_CHANNEL_ID }}|g" /tmp/deploy.sh
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" /tmp/deploy.sh
          sed -i "s|__GOOGLE_CLIENT_SECRET__|${{ secrets.GOOGLE_CLIENT_SECRET }}|g" /tmp/deploy.sh
          sed -i "s|__GOOGLE_REDIRECT_URI__|${{ secrets.GOOGLE_REDIRECT_URI }}|g" /tmp/deploy.sh
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_URL }}|g" /tmp/deploy.sh
          sed -i "s|__SUPABASE_KEY__|${{ secrets.SUPABASE_KEY }}|g" /tmp/deploy.sh
          sed -i "s|__DEPLOY_BACKEND__|${{ steps.changes.outputs.backend }}|g" /tmp/deploy.sh
          sed -i "s|__DEPLOY_FRONTEND__|${{ steps.changes.outputs.frontend }}|g" /tmp/deploy.sh
          sed -i "s|__DEPLOY_FASTAPI__|${{ steps.changes.outputs.fastapi }}|g" /tmp/deploy.sh

      # 이 정리는 매 배포마다 돌린다. 배포 스크립트의 assert_minimum_docker_space
      # 4GiB 가드가 정리 전 여유공간(2.666GiB 관측)으로는 항상 실패하기 때문이다.
      # 대상은 재생성 가능한 로그·캐시뿐이며 활성 컨테이너·이미지·DB 볼륨·named
      # volume 은 건드리지 않는다. 여기서 바닥을 못 채워도 실패시키지 않고,
      # 배포 스크립트의 fail-closed 가드가 진단과 함께 최종 판정한다.
      # workflow_dispatch 에서 cleanup_logs_and_caches=true 면 이 단계에서 즉시
      # 실패시켜 원인을 배포 전에 드러낸다.
      - name: Clean approved logs and caches before container recreation
        if: steps.changes.outputs.backend == 'true' || steps.changes.outputs.fastapi == 'true' || steps.changes.outputs.frontend == 'true'
        shell: bash
        env:
          STRICT_CLEANUP: ${{ github.event_name == 'workflow_dispatch' && inputs.cleanup_logs_and_caches }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }}" \
            "bash -s -- '${STRICT_CLEANUP}'" <<'CLEANUP_EOF'
          set -euo pipefail
          STRICT="${1:-false}"

          report_space() {
            echo "=== Safe reclaim: $1 ==="
            df -Pk /var/lib/docker 2>/dev/null || df -Pk /
            sudo journalctl --disk-usage || true
            sudo du -sh /var/cache/apt 2>/dev/null || true
          }

          # 컨테이너가 떠 있지 않으면 그 컨테이너 내부 정리만 건너뛴다.
          # 첫 배포나 장애 복구 상황에서 호스트 레벨 회수까지 막지 않기 위함이다.
          container_running() {
            [ "$(docker inspect --format '{{.State.Status}}' "$1" 2>/dev/null || true)" = "running" ]
          }

          report_space "before"

          # 1. systemd journal 과 apt 캐시 (호스트, 항상 재생성 가능)
          sudo journalctl --rotate || true
          sudo journalctl --vacuum-size=64M || true
          sudo apt-get clean || true

          # 2. Docker 컨테이너 json 로그. run_with_log_rotation 이전에 만들어진
          #    컨테이너는 회전 설정이 없어 무제한 증가한다. 파일을 지우지 않고
          #    truncate 하므로 실행 중인 컨테이너의 로그 핸들이 깨지지 않는다.
          for log_path in $(sudo find /var/lib/docker/containers -name '*-json.log' -size +32M 2>/dev/null || true); do
            echo "Truncating oversized container log: $log_path"
            sudo truncate -s 0 "$log_path" || true
          done

          # 3. 애플리케이션 로그와 모델 캐시 (컨테이너 내부, 재생성 가능)
          if container_running sdui-backend; then
            docker exec sdui-backend sh -ceu '
              if [ -d /app/logs ]; then
                find /app/logs -mindepth 1 -maxdepth 1 -type f -name "application-*.log" -delete
                if [ -f /app/logs/application.log ]; then
                  : > /app/logs/application.log
                fi
              fi
            ' || true
          else
            echo "sdui-backend is not running; skipping its log reclaim."
          fi

          if container_running kride-fastapi; then
            docker exec kride-fastapi sh -ceu '
              if [ -d /tmp/hf_cache ]; then
                find /tmp/hf_cache -mindepth 1 -delete
              fi
            ' || true
          else
            echo "kride-fastapi is not running; skipping its cache reclaim."
          fi

          # 4. Docker build cache 와 dangling image. 태그된 이미지와 named
          #    volume 은 대상이 아니다.
          docker builder prune -af || true

          sync
          report_space "after"

          available_kb="$(
            df -Pk /var/lib/docker 2>/dev/null | awk 'NR == 2 { print $4 }'
          )"
          if [ -z "$available_kb" ]; then
            available_kb="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          fi
          if ! printf '%s' "$available_kb" | grep -Eq '^[0-9]+$'; then
            echo "Unable to determine free space after safe reclaim."
            exit 1
          fi
          if [ "$available_kb" -lt 4194304 ]; then
            echo "Safe reclaim left ${available_kb}KB available; deployment requires 4194304KB."
            docker system df -v || true
            if [ "$STRICT" = "true" ]; then
              exit 1
            fi
            echo "::warning::EC2 free space is still below the 4GiB deploy floor after safe reclaim."
          fi
          CLEANUP_EOF

      - name: Deploy to EC2
        run: |
          cat /tmp/deploy.sh | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_USERNAME }}@${{ secrets.AWS_HOST }} bash
