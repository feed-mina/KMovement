name: Deploy FastAPI to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".gcloudignore"
      - "src/api/**"
      - "src/**"
      - "dataset/data/raw_ml/road_scored.csv"
      - "dataset/data/raw_ml/facility_clean.csv"
      - "dataset/data/raw_ml/tour_poi.csv"
      - "dataset/models/route_graph.pkl"
      - "chroma_db/**"
      - ".github/workflows/deploy-cloud-run.yml"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'quartz-kiba' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'kmovement' }}
  GAR_REPO: ${{ vars.GAR_REPO || 'kmovement' }}
  CLOUD_RUN_MEMORY: ${{ vars.CLOUD_RUN_MEMORY || '2Gi' }}
  CLOUD_RUN_CPU: ${{ vars.CLOUD_RUN_CPU || '1' }}
  CLOUD_RUN_TIMEOUT: ${{ vars.CLOUD_RUN_TIMEOUT || '300s' }}
  CLOUD_RUN_CONCURRENCY: ${{ vars.CLOUD_RUN_CONCURRENCY || '10' }}
  CLOUD_RUN_MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '0' }}
  CLOUD_RUN_MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '3' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$GAR_REPO" \
            --location "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$GAR_REPO" \
            --repository-format docker \
            --location "$GCP_REGION" \
            --description "KMovement Cloud Run images" \
            --project "$GCP_PROJECT_ID"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPO/$CLOUD_RUN_SERVICE:$GITHUB_SHA"
          LATEST_IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPO/$CLOUD_RUN_SERVICE:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" -t "$LATEST_IMAGE" .
          docker push "$IMAGE"
          docker push "$LATEST_IMAGE"

      - name: Deploy image to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --memory "$CLOUD_RUN_MEMORY" \
            --cpu "$CLOUD_RUN_CPU" \
            --timeout "$CLOUD_RUN_TIMEOUT" \
            --concurrency "$CLOUD_RUN_CONCURRENCY" \
            --min-instances "$CLOUD_RUN_MIN_INSTANCES" \
            --max-instances "$CLOUD_RUN_MAX_INSTANCES" \
            --set-env-vars "TORCHSERVE_ENABLED=false,TORCHSERVE_FALLBACK=true,CHROMA_MODE=persistent,CHROMA_PATH=/app/chroma_db,KRIDE_MODELS_DIR=/app/dataset/models,KRIDE_RAW_DATA_DIR=/app/dataset/data/raw_ml,HF_HOME=/tmp/hf_cache,TRANSFORMERS_CACHE=/tmp/hf_cache/hub"

      - name: Smoke test Cloud Run health
        run: |
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')"
          echo "Cloud Run URL: $URL"
          curl -fsS "$URL/api/health"
