name: Build & Push RunPod Tora Worker

on:
  push:
    branches: ["main"]
    paths:
      - "deploy/media_motion/**"
      - ".github/workflows/deploy-runpod-tora.yml"
  workflow_dispatch:

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/kride-tora-gpu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/media_motion/Dockerfile.tora
          push: true
          no-cache: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.sha_short }}

      - name: Summary
        run: |
          echo "## RunPod Tora Worker Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest:** \`${{ env.DOCKERHUB_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tora CogVideoX-5B I2V (별도 RunPod 엔드포인트에서 사용)" >> $GITHUB_STEP_SUMMARY
