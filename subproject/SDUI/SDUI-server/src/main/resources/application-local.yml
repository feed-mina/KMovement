# 로컬 개발 전용 설정. 아래 비밀번호·키는 개발 PC에서만 쓰는 값이며 운영에서 쓰지 않는다.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/SDUI_TD
    username: postgres
    password: "1234"
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
    openai:
      api-key: ${OPENAI_API_KEY}

