name: kmovement-web

services:
  web:
    image: ${KMOVEMENT_WEB_IMAGE:?Set KMOVEMENT_WEB_IMAGE to a digest-pinned image}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  proxy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a digest-pinned image}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      KMOVEMENT_SITE_HOST: ${KMOVEMENT_SITE_HOST:?Set KMOVEMENT_SITE_HOST to the temporary hostname}
      ACME_CONTACT_EMAIL: ${ACME_CONTACT_EMAIL:?Set ACME_CONTACT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
