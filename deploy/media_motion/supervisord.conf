[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
priority=10
autorestart=true
stdout_logfile=/tmp/redis.log
stderr_logfile=/tmp/redis_err.log

[program:torchserve]
; AnimatedDrawings drawn-humanoid detector + pose estimator on localhost:8080.
; Runs in the isolated ad_env (py3.8 + torch 1.13 + mmdet/mmpose). Started before
; the handler so image_to_animation.py can reach 8080.
command=/opt/miniconda/envs/ad_env/bin/torchserve --start --foreground --ncs --ts-config /home/torchserve/config.properties
directory=/home/torchserve
priority=15
autorestart=true
startsecs=15
stdout_logfile=/tmp/torchserve.log
stderr_logfile=/tmp/torchserve_err.log

[program:celery-media]
command=celery -A deploy.media_motion.celery_media worker -l info -c 4 -Q media
directory=/app
priority=20
autorestart=true
startsecs=5
stdout_logfile=/tmp/celery.log
stderr_logfile=/tmp/celery_err.log

[program:runpod-handler]
command=python -m deploy.media_motion.runpod_handler
directory=/app
priority=30
autorestart=false
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
