<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1260" role="img" aria-labelledby="start-flow-title"><title id="start-flow-title">F4 병합 후 시작 순서: 기본 영상 확인, 영상·댄스와 코칭 두 갈래</title><defs><marker id="start-flow-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#607568"/></marker></defs><rect width="1120" height="1260" rx="20" fill="#f6f8f3"/><g font-family="Malgun Gothic,Noto Sans KR,sans-serif" fill="#203e32"><text x="30" y="42" font-size="27" font-weight="700">F4 · 지금은 기본 영상부터 확인한다</text><text x="30" y="74" font-size="17" font-weight="400">다음 개발의 실행 계획 / 운영 성공 화면이나 현재 함수 호출도가 아님</text><rect x="380" y="105" width="360" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="400" y="137" font-size="21" font-weight="700">S0  운영 연결표 확인</text><text x="400" y="167" font-size="17" font-weight="400">버전 · 플래그 · 목적지 · 보관 폴더</text><polyline points="560,185 560,230" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><rect x="380" y="230" width="360" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="400" y="262" font-size="21" font-weight="700">S1  기본 사진 영상 한 건</text><text x="400" y="292" font-size="17" font-weight="400">업로드 → 5초 영상 → 이력·재생</text><polyline points="560,310 560,355" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><rect x="380" y="355" width="360" height="80" rx="14" fill="#e5eee4" stroke="#b2c2b5" stroke-width="1.5"/><text x="400" y="387" font-size="21" font-weight="700">본인 계정에서 끝까지 되나?</text><text x="400" y="417" font-size="17" font-weight="400">새로고침 복원 · 다른 계정 차단</text><rect x="20" y="355" width="285" height="100" rx="14" fill="#fbebdf" stroke="#b2c2b5" stroke-width="1.5"/><text x="40" y="387" font-size="21" font-weight="700">안 되면 연결부터 수정</text><text x="40" y="417" font-size="17" font-weight="400">인증 · 작업자 · 볼륨 · 재생</text><polyline points="380,395 305,395" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="320" y="381" font-size="16" font-weight="400">실패</text><polyline points="160,355 160,270 380,270" fill="none" stroke="#607568" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#start-flow-arrow)"/><text x="190" y="258" font-size="16" font-weight="400">다시 확인</text><rect x="380" y="505" width="360" height="80" rx="14" fill="#dfeee8" stroke="#b2c2b5" stroke-width="1.5"/><text x="400" y="537" font-size="21" font-weight="700">기본 흐름 통과</text><text x="400" y="567" font-size="17" font-weight="400">이후 두 갈래는 별도로 진행</text><polyline points="560,435 560,505" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="580" y="475" font-size="16" font-weight="400">통과</text><polyline points="560,585 560,620 270,620 270,685" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><polyline points="560,620 850,620 850,685" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="28" y="662" font-size="21" font-weight="700">A · 영상과 댄스</text><text x="608" y="662" font-size="21" font-weight="700">C · 카메라 코칭</text><rect x="20" y="685" width="500" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="40" y="717" font-size="21" font-weight="700">A1  Hostinger 영상 중계 분리</text><text x="40" y="747" font-size="17" font-weight="400">기존 코스·채팅 주소는 유지</text><rect x="20" y="830" width="500" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="40" y="862" font-size="21" font-weight="700">A2  기존 CogVideoX 단일 복구</text><text x="40" y="892" font-size="17" font-weight="400">실제 실행 모델 · 결과 보관 · 재생 확인</text><polyline points="270,765 270,830" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="295" y="803" font-size="16" font-weight="400">모형 확인 후 GPU 시험</text><rect x="20" y="975" width="500" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="40" y="1007" font-size="21" font-weight="700">A3  개인 사진 AI 연결</text><text x="40" y="1037" font-size="17" font-weight="400">본인 확인 · 전송 동의 · 비공개 결과 회수</text><polyline points="270,910 270,975" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="295" y="947" font-size="16" font-weight="400">시험 입력 한 건 통과</text><rect x="20" y="1120" width="500" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="40" y="1152" font-size="21" font-weight="700">A4  댄스 모델 하나 연결</text><text x="40" y="1182" font-size="17" font-weight="400">UniAnimate-DiT 우선 검토 · 공식 전처리</text><polyline points="270,1055 270,1120" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="295" y="1092" font-size="16" font-weight="400">개인 보관 계약 확인</text><rect x="600" y="685" width="500" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="620" y="717" font-size="21" font-weight="700">C1  MediaPipe로 관절 읽기</text><text x="620" y="747" font-size="17" font-weight="400">카메라 허용/거절 · 별도 계산 스레드</text><rect x="600" y="830" width="500" height="80" rx="14" fill="white" stroke="#b2c2b5" stroke-width="1.5"/><text x="620" y="862" font-size="21" font-weight="700">C2  한 동작의 차이 설명</text><text x="620" y="892" font-size="17" font-weight="400">몸 크기 · 좌우 방향 · 동작 시간 맞춤</text><polyline points="850,765 850,830" fill="none" stroke="#607568" stroke-width="2.2" marker-end="url(#start-flow-arrow)"/><text x="865" y="803" font-size="16" font-weight="400">관절이 안정적으로 보이면</text><text x="620" y="980" font-size="20" font-weight="700">생성형 GPU 준비와 별개로 시험 가능</text><text x="620" y="1020" font-size="18" font-weight="400">원본 기준 동작과 비교하고,</text><text x="620" y="1050" font-size="18" font-weight="400">잘 안 보이는 구간은 판단을 보류한다.</text><text x="30" y="1235" font-size="17" font-weight="400">각 단계의 통과 기준은 아래 표에서 확인한다. 모델 16개는 역할별 후보이며 한 번에 연결하지 않는다.</text></g></svg>