<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" role="img" aria-label="T1 현재 코스 연결 화면의 코드 기반 재구성"><title>T1 현재 코스 연결 화면의 코드 기반 재구성</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1140" height="660" rx="18" fill="#f5f5f0"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif" fill="#15212c"><text x="30" y="44" font-size="24" font-weight="700" fill="#15212c">T1 · 코스에서 선택한 장소를 영상에 기록</text><text x="30" y="74" font-size="15" font-weight="400" fill="#52606d">현재 코드 기반 재구성 / 운영 캡처 아님 / 장소·번호·상태는 설명용 예시</text><rect x="28" y="105" width="332" height="510" rx="16" fill="white" stroke="#ccd4d9"/><text x="48" y="145" font-size="22" font-weight="700" fill="#15212c">코스 결과</text><rect x="404" y="105" width="332" height="510" rx="16" fill="white" stroke="#ccd4d9"/><text x="424" y="145" font-size="22" font-weight="700" fill="#15212c">개인 영상 · 만들기</text><rect x="780" y="105" width="332" height="510" rx="16" fill="white" stroke="#ccd4d9"/><text x="800" y="145" font-size="22" font-weight="700" fill="#15212c">선택한 영상 작업</text><rect x="48" y="180" width="292" height="96" rx="12" fill="white" stroke="#ccd4d9"/><text x="66" y="211" font-size="18" font-weight="700" fill="#15212c">서울 당일치기 코스</text><text x="66" y="239" font-size="14" font-weight="400" fill="#52606d">설명용 서울 장소 · poi:17</text><rect x="48" y="315" width="292" height="106" rx="12" fill="#fce8dd" stroke="#ccd4d9"/><text x="66" y="346" font-size="18" font-weight="700" fill="#15212c">이 코스의 여행 사진으로</text><text x="66" y="374" font-size="14" font-weight="400" fill="#52606d">영상 만들기</text><text x="48" y="465" font-size="16" font-weight="400" fill="#15212c">토큰 + 선택용 장소 목록</text><text x="48" y="495" font-size="14" font-weight="400" fill="#52606d">브라우저에 임시 보관 후 이동</text><text x="424" y="193" font-size="17" font-weight="700" fill="#15212c">이 사진과 연결할 코스 장소</text><rect x="424" y="217" width="292" height="76" rx="12" fill="white" stroke="#ccd4d9"/><text x="442" y="248" font-size="18" font-weight="700" fill="#15212c">장소 선택  ▾</text><text x="442" y="276" font-size="14" font-weight="400" fill="#52606d">설명용 서울 장소</text><text x="424" y="329" font-size="14" font-weight="400" fill="#8a432f">촬영 위치를 자동 판정하지 않음</text><rect x="424" y="357" width="292" height="76" rx="12" fill="white" stroke="#ccd4d9"/><text x="442" y="388" font-size="18" font-weight="700" fill="#15212c">코스 연결 없이 만들기</text><text x="442" y="416" font-size="14" font-weight="400" fill="#52606d">선택 정보만 해제</text><rect x="424" y="459" width="292" height="88" rx="12" fill="#e4efec" stroke="#ccd4d9"/><text x="442" y="490" font-size="18" font-weight="700" fill="#15212c">사진 올리기 → 영상 만들기</text><text x="442" y="518" font-size="14" font-weight="400" fill="#52606d">서버가 장소를 다시 검증</text><rect x="800" y="180" width="292" height="76" rx="12" fill="white" stroke="#ccd4d9"/><text x="818" y="211" font-size="18" font-weight="700" fill="#15212c">영상 생성 완료</text><text x="818" y="239" font-size="14" font-weight="400" fill="#52606d">사진 확대·이동 / 5초</text><text x="800" y="309" font-size="15" font-weight="700" fill="#15212c">연결 장소: 설명용 서울 장소</text><text x="800" y="343" font-size="15" font-weight="400" fill="#15212c">코스 번호 11111111</text><text x="800" y="390" font-size="15" font-weight="400" fill="#52606d">사진의 실제 촬영 위치·</text><text x="800" y="421" font-size="14" font-weight="400" fill="#52606d">아티스트 방문 사실은 증명 안 함</text><rect x="800" y="465" width="292" height="82" rx="12" fill="white" stroke="#ccd4d9"/><text x="818" y="496" font-size="18" font-weight="700" fill="#15212c">영상 재생 / 다운로드</text><text x="818" y="524" font-size="14" font-weight="400" fill="#52606d">코스 전체 복원 기능은 없음</text></g></svg>