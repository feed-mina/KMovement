<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 820" role="img" aria-label="R1 소스 기준 Tora 단일과 미디어·배치 분기"><title>R1 소스 기준 Tora 단일과 미디어·배치 분기</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1140" height="820" rx="18" fill="#f5f5f0"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif" fill="#15212c"><text x="30" y="44" font-size="24" font-weight="700" fill="#15212c">R1 · 작업 종류와 엔드포인트를 구분</text><text x="30" y="72" font-size="15" font-weight="400" fill="#8a432f">소스 분기 / 콘솔 미디어 설정 확인 · 서버 매핑·Tora 실적 미확인</text><rect x="390" y="105" width="360" height="76" rx="12" fill="white" stroke="#ccd4d9"/><text x="408" y="136" font-size="18" font-weight="700" fill="#15212c">Spring 영상 요청</text><text x="408" y="164" font-size="14" font-weight="400" fill="#52606d">POST /jobs/runpod 또는 /batch</text><rect x="55" y="239" width="460" height="76" rx="12" fill="white" stroke="#ccd4d9"/><text x="73" y="270" font-size="18" font-weight="700" fill="#15212c">단일 route = tora_cogvideox_i2v</text><text x="73" y="298" font-size="14" font-weight="400" fill="#52606d">대체 생성 허용 안 함</text><rect x="625" y="239" width="460" height="76" rx="12" fill="white" stroke="#ccd4d9"/><text x="643" y="270" font-size="18" font-weight="700" fill="#15212c">일반 단일 또는 batch_video</text><text x="643" y="298" font-size="14" font-weight="400" fill="#52606d">배치는 미디어 엔드포인트 사용</text><path d="M450,181 L285,239" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="375.5" y="203.0" font-size="13" font-weight="400" fill="#475569">Tora 단일</text><path d="M695,181 L855,239" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="783.0" y="203.0" font-size="13" font-weight="400" fill="#475569">그 외·배치</text><rect x="55" y="371" width="460" height="80" rx="12" fill="#fce8dd" stroke="#ccd4d9"/><text x="73" y="402" font-size="18" font-weight="700" fill="#15212c">Tora ID 또는 레거시 ID</text><text x="73" y="430" font-size="14" font-weight="400" fill="#52606d">/v2/{endpoint}/run</text><rect x="625" y="371" width="460" height="80" rx="12" fill="#e4efec" stroke="#ccd4d9"/><text x="643" y="402" font-size="18" font-weight="700" fill="#15212c">Media ID 또는 레거시 ID</text><text x="643" y="430" font-size="14" font-weight="400" fill="#52606d">/v2/{endpoint}/run</text><path d="M285,315 L285,371" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="293.0" y="336.0" font-size="13" font-weight="400" fill="#475569">제출</text><path d="M855,315 L855,371" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="863.0" y="336.0" font-size="13" font-weight="400" fill="#475569">제출</text><rect x="625" y="500" width="460" height="106" rx="12" fill="white" stroke="#ccd4d9"/><text x="643" y="531" font-size="18" font-weight="700" fill="#15212c">배치: 같은 작업자 안에서 처리</text><text x="643" y="559" font-size="14" font-weight="400" fill="#52606d">auto: Tora 선택 없음 / 명시 Tora: 로컬 시도</text><text x="646" y="585" font-size="15" font-weight="400" fill="#52606d">Tora 실패 → CogVideoX → 3d_photo_light</text><path d="M855,451 L855,500" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="863.0" y="468.5" font-size="13" font-weight="400" fill="#475569">batch_video일 때</text><rect x="260" y="680" width="620" height="85" rx="12" fill="white" stroke="#ccd4d9"/><text x="278" y="711" font-size="18" font-weight="700" fill="#15212c">결과: /v2/{endpoint}/status/{job_id}</text><text x="278" y="739" font-size="14" font-weight="400" fill="#52606d">Spring은 작업 ID·route 저장 / endpoint ID 전용 저장 없음</text><path d="M285,451 L380,680" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="340.5" y="558.5" font-size="13" font-weight="400" fill="#475569">상태 조회</text><path d="M855,606 L760,680" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="815.5" y="636.0" font-size="13" font-weight="400" fill="#475569">상태 조회</text></g></svg>