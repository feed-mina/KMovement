<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" role="img" aria-label="G1 코드 기반 현재 화면 재구성"><title>G1 코드 기반 현재 화면 재구성</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1140" height="700" rx="18" fill="#f5f5f0"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif" fill="#15212c"><text x="30" y="42" font-size="24" font-weight="700" fill="#15212c">G1 · 현재 코드 기반 재구성 / 운영 캡처 아님</text><text x="30" y="72" font-size="15" font-weight="400" fill="#586875">모든 이름·숫자·작업 상태는 설명용 예시입니다.</text><rect x="28" y="100" width="332" height="558" rx="18" fill="white" stroke="#cfd7dc"/><text x="50" y="138" font-size="23" font-weight="700" fill="#15212c">마이페이지</text><text x="50" y="180" font-size="17" font-weight="400" fill="#15212c">설명용 회원</text><rect x="404" y="100" width="332" height="558" rx="18" fill="white" stroke="#cfd7dc"/><text x="426" y="138" font-size="23" font-weight="700" fill="#15212c">내 목록</text><rect x="780" y="100" width="332" height="558" rx="18" fill="white" stroke="#cfd7dc"/><text x="802" y="138" font-size="23" font-weight="700" fill="#15212c">내 영상</text><rect x="48" y="220" width="292" height="77" rx="12" fill="white" stroke="#ccd4d9"/><text x="66" y="251" font-size="18" font-weight="700" fill="#15212c">저장 아티스트  3</text><text x="66" y="279" font-size="14" font-weight="400" fill="#52606d">저장 일정  2   /   상품  1</text><rect x="48" y="323" width="292" height="58" rx="12" fill="white" stroke="#ccd4d9"/><text x="66" y="354" font-size="18" font-weight="700" fill="#15212c">내 목록 보기</text><rect x="48" y="396" width="292" height="58" rx="12" fill="white" stroke="#ccd4d9"/><text x="66" y="427" font-size="18" font-weight="700" fill="#15212c">홈으로</text><text x="50" y="510" font-size="16" font-weight="700" fill="#9d432f">C1  개인 영상 진입 없음</text><text x="426" y="182" font-size="16" font-weight="700" fill="#15212c">아티스트   일정   상품</text><rect x="424" y="220" width="292" height="86" rx="12" fill="white" stroke="#ccd4d9"/><text x="442" y="251" font-size="18" font-weight="700" fill="#15212c">설명용 팬 일정</text><text x="442" y="279" font-size="14" font-weight="400" fill="#52606d">공개     보기     삭제</text><text x="426" y="352" font-size="15" font-weight="400" fill="#15212c">마이페이지로 돌아가기</text><text x="426" y="510" font-size="16" font-weight="700" fill="#9d432f">C2  개인 영상 이동 없음</text><text x="802" y="183" font-size="14" font-weight="400" fill="#15212c">로그인 · 여행 코스로 돌아가기</text><rect x="800" y="218" width="292" height="94" rx="12" fill="white" stroke="#ccd4d9"/><text x="818" y="249" font-size="18" font-weight="700" fill="#15212c">여행 사진 선택</text><text x="818" y="277" font-size="14" font-weight="400" fill="#52606d">사진 올리기  /  영상 만들기</text><rect x="800" y="334" width="292" height="92" rx="12" fill="white" stroke="#ccd4d9"/><text x="818" y="365" font-size="18" font-weight="700" fill="#15212c">이전 작업</text><text x="818" y="393" font-size="14" font-weight="400" fill="#52606d">생성 완료 · 설명용 작업</text><text x="802" y="488" font-size="15" font-weight="700" fill="#9d432f">C3  이력 상태 표시 보강 필요</text><text x="802" y="521" font-size="14" font-weight="400" fill="#52606d">로그인 후 영상 복귀도 보강</text></g></svg>