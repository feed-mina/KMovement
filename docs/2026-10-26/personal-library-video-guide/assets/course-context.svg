<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 1040" role="img" aria-label="T2 코스 검증 후 개인 작업 저장 흐름"><title>T2 코스 검증 후 개인 작업 저장 흐름</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1140" height="1040" rx="18" fill="#f5f5f0"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif" fill="#15212c"><text x="30" y="44" font-size="24" font-weight="700" fill="#15212c">T2 · 새 작업에서만 코스 연결을 검증</text><text x="30" y="74" font-size="15" font-weight="400" fill="#52606d">실선: 실제 처리 순서 / 각 실패는 새 개인 작업 저장 전에 종료</text><rect x="390" y="104" width="360" height="78" rx="12" fill="white" stroke="#ccd4d9"/><text x="408" y="135" font-size="18" font-weight="700" fill="#15212c">V1 로그인·요청 필드 확인</text><text x="408" y="163" font-size="14" font-weight="400" fill="#52606d">Spring /auth/me → owner 확정</text><path d="M570,182 L570,232" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="578.0" y="200.0" font-size="13" font-weight="400" fill="#475569">입력 정상</text><rect x="390" y="232" width="360" height="78" rx="12" fill="white" stroke="#ccd4d9"/><text x="408" y="263" font-size="18" font-weight="700" fill="#15212c">코스 필드가 있는가?</text><text x="408" y="291" font-size="14" font-weight="400" fill="#52606d">courseContext + poiId</text><path d="M750,270 L955,270" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="860.5" y="263.0" font-size="13" font-weight="400" fill="#475569">있음</text><rect x="800" y="334" width="310" height="94" rx="12" fill="#fce8dd" stroke="#ccd4d9"/><text x="818" y="365" font-size="18" font-weight="700" fill="#15212c">V2 코스 검증 API 호출</text><text x="818" y="393" font-size="14" font-weight="400" fill="#52606d">내부 인증 + 허용 계정</text><path d="M955,270 L955,334" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M390,270 L185,270" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="295.5" y="263.0" font-size="13" font-weight="400" fill="#475569">없음</text><rect x="30" y="334" width="310" height="94" rx="12" fill="white" stroke="#ccd4d9"/><text x="48" y="365" font-size="18" font-weight="700" fill="#15212c">코스 연결 없이 진행</text><text x="48" y="393" font-size="14" font-weight="400" fill="#52606d">trip = 없음 / 검증 API 생략</text><path d="M185,270 L185,334" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="630" y="485" width="480" height="82" rx="12" fill="white" stroke="#ccd4d9"/><text x="648" y="516" font-size="18" font-weight="700" fill="#15212c">V3 서명·소유자·만료·자료 버전</text><text x="648" y="544" font-size="14" font-weight="400" fill="#52606d">현재 공개 카탈로그와 비교</text><path d="M955,428 L955,485" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="963.0" y="449.5" font-size="13" font-weight="400" fill="#475569">인증 성공</text><rect x="630" y="627" width="480" height="82" rx="12" fill="white" stroke="#ccd4d9"/><text x="648" y="658" font-size="18" font-weight="700" fill="#15212c">V4 선택 장소의 코스 포함 확인</text><text x="648" y="686" font-size="14" font-weight="400" fill="#52606d">성공: 서버가 장소 정보 7필드 반환</text><path d="M870,567 L870,627" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="878.0" y="590.0" font-size="13" font-weight="400" fill="#475569">토큰 유효</text><rect x="30" y="520" width="420" height="109" rx="12" fill="#fce8dd" stroke="#ccd4d9"/><text x="48" y="551" font-size="18" font-weight="700" fill="#15212c">실패 → 요청 종료</text><text x="48" y="579" font-size="14" font-weight="400" fill="#52606d">401 / 403 / 409 / 422 / 503</text><text x="50" y="605" font-size="15" font-weight="400" fill="#8a432f">아직 jobs INSERT 없음</text><path d="M630,526 L450,570" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="548.0" y="541.0" font-size="13" font-weight="400" fill="#475569">검증 실패</text><path d="M630,668 L450,600" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="548.0" y="627.0" font-size="13" font-weight="400" fill="#475569">코스 밖 장소</text><rect x="390" y="800" width="550" height="90" rx="12" fill="#e4efec" stroke="#ccd4d9"/><text x="408" y="831" font-size="18" font-weight="700" fill="#15212c">V5 개인 API가 사진 소유권·요청 확인</text><text x="408" y="859" font-size="14" font-weight="400" fill="#52606d">trip → JSON TEXT → SQLite jobs.trip_json</text><path d="M870,709 L800,800" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="843.0" y="747.5" font-size="13" font-weight="400" fill="#475569">검증된 trip</text><path d="M185,428 L185,465" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M185,465 L15,465" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M15,465 L15,845" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M15,845 L390,845" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="210.5" y="838.0" font-size="13" font-weight="400" fill="#475569">trip 없음</text><rect x="390" y="940" width="550" height="72" rx="12" fill="white" stroke="#ccd4d9"/><text x="408" y="971" font-size="18" font-weight="700" fill="#15212c">작업 응답 · 이후 CPU 렌더링</text><text x="408" y="999" font-size="14" font-weight="400" fill="#52606d">FFmpeg는 사진 ID만 사용 / trip은 이력 설명</text><path d="M665,890 L665,940" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="673.0" y="908.0" font-size="13" font-weight="400" fill="#475569">저장 성공</text></g></svg>