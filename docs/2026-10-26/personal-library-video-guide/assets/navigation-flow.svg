<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 720" role="img" aria-label="F1 화면 이동과 조회 분기"><title>F1 화면 이동과 조회 분기</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1140" height="720" rx="18" fill="#f5f5f0"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif" fill="#15212c"><text x="32" y="44" font-size="24" font-weight="700" fill="#15212c">F1–F5 · 제안하는 이동·조회 흐름</text><rect x="395" y="80" width="350" height="76" rx="12" fill="#f0f3e6" stroke="#ccd4d9"/><text x="413" y="111" font-size="18" font-weight="700" fill="#15212c">F1 공통 메뉴 선택</text><text x="413" y="139" font-size="14" font-weight="400" fill="#52606d">내 목록 또는 내 영상</text><path d="M570,156 L570,202" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="578.0" y="172.0" font-size="13" font-weight="400" fill="#475569">이동</text><rect x="395" y="202" width="350" height="78" rx="12" fill="white" stroke="#ccd4d9"/><text x="413" y="233" font-size="18" font-weight="700" fill="#15212c">F2 기능·인증 확인</text><text x="413" y="261" font-size="14" font-weight="400" fill="#52606d">서버 허용과 로그인 상태</text><path d="M395,241 L300,241" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="355.5" y="234.0" font-size="13" font-weight="400" fill="#475569">미준비·비로그인</text><rect x="32" y="202" width="265" height="98" rx="12" fill="#fce8dd" stroke="#ccd4d9"/><text x="50" y="233" font-size="18" font-weight="700" fill="#15212c">안내·로그인</text><text x="50" y="261" font-size="14" font-weight="400" fill="#52606d">허용된 복귀 주소만 보존</text><path d="M570,280 L570,327" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="578.0" y="296.5" font-size="13" font-weight="400" fill="#475569">준비·인증됨</text><rect x="395" y="327" width="350" height="77" rx="12" fill="white" stroke="#ccd4d9"/><text x="413" y="358" font-size="18" font-weight="700" fill="#15212c">F3 해당 화면만 조회</text><text x="413" y="386" font-size="14" font-weight="400" fill="#52606d">목록과 영상 요청은 독립</text><path d="M570,404 L570,448" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="578.0" y="419.0" font-size="13" font-weight="400" fill="#475569">응답</text><rect x="395" y="448" width="350" height="77" rx="12" fill="white" stroke="#ccd4d9"/><text x="413" y="479" font-size="18" font-weight="700" fill="#15212c">F4 응답 상태 분리</text><text x="413" y="507" font-size="14" font-weight="400" fill="#52606d">성공 · 빈 결과 · 조회 실패</text><path d="M745,488 L814,488" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="787.5" y="481.0" font-size="13" font-weight="400" fill="#475569">빈 결과·실패</text><rect x="817" y="448" width="293" height="97" rx="12" fill="#fce8dd" stroke="#ccd4d9"/><text x="835" y="479" font-size="18" font-weight="700" fill="#15212c">상태별 안내</text><text x="835" y="507" font-size="14" font-weight="400" fill="#52606d">해당 조회만 재시도</text><path d="M570,525 L570,574" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="578.0" y="542.5" font-size="13" font-weight="400" fill="#475569">작업 선택</text><rect x="395" y="574" width="350" height="95" rx="12" fill="#e4efec" stroke="#ccd4d9"/><text x="413" y="605" font-size="18" font-weight="700" fill="#15212c">F5 소유자 재조회·재생</text><text x="413" y="633" font-size="14" font-weight="400" fill="#52606d">완료 + 권한 + 파일 확인</text></g></svg>