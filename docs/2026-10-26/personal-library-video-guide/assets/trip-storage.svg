<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 850" role="img" aria-label="T3 공개 코스 자료와 개인 작업 저장 경계"><title>T3 공개 코스 자료와 개인 작업 저장 경계</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs><rect width="1140" height="850" rx="18" fill="#f5f5f0"/><g font-family="'Malgun Gothic','Noto Sans KR',sans-serif" fill="#15212c"><text x="30" y="44" font-size="24" font-weight="700" fill="#15212c">T3 · API 연결과 DB 외래키를 구분</text><text x="30" y="74" font-size="15" font-weight="400" fill="#52606d">실선: 요청·저장·응답 / 점선: 값으로 남긴 논리 참조 / 외래키는 SQLite 내부만</text><rect x="30" y="116" width="460" height="85" rx="12" fill="white" stroke="#ccd4d9"/><text x="48" y="147" font-size="18" font-weight="700" fill="#15212c">공개 장소 카탈로그</text><text x="48" y="175" font-size="14" font-weight="400" fill="#52606d">검수 파일 + Spring PostgreSQL 공개 뷰</text><rect x="650" y="116" width="460" height="85" rx="12" fill="white" stroke="#ccd4d9"/><text x="668" y="147" font-size="18" font-weight="700" fill="#15212c">브라우저의 코스 선택</text><text x="668" y="175" font-size="14" font-weight="400" fill="#52606d">sessionStorage: 서명 토큰 + id/name</text><rect x="330" y="285" width="480" height="92" rx="12" fill="white" stroke="#ccd4d9"/><text x="348" y="316" font-size="18" font-weight="700" fill="#15212c">코스 검증 API</text><text x="348" y="344" font-size="14" font-weight="400" fill="#52606d">토큰 + 로그인 owner + 선택 poiId → trip</text><path d="M300,201 L410,285" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="363.0" y="236.0" font-size="13" font-weight="400" fill="#475569">현재 자료 조회</text><path d="M880,201 L735,285" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="815.5" y="236.0" font-size="13" font-weight="400" fill="#475569">선택 값 전송</text><rect x="30" y="486" width="420" height="110" rx="12" fill="#e4efec" stroke="#ccd4d9"/><text x="48" y="517" font-size="18" font-weight="700" fill="#15212c">개인 SQLite · jobs</text><text x="48" y="545" font-size="14" font-weight="400" fill="#52606d">owner / photo_id / 상태 / trip_json</text><text x="50" y="573" font-size="15" font-weight="400" fill="#52606d">trip은 선택 장소의 당시 정보</text><path d="M490,377 L300,486" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403.0" y="424.5" font-size="13" font-weight="400" fill="#475569">검증 응답 저장</text><rect x="650" y="486" width="460" height="110" rx="12" fill="#e4efec" stroke="#ccd4d9"/><text x="668" y="517" font-size="18" font-weight="700" fill="#15212c">개인 SQLite · photos</text><text x="668" y="545" font-size="14" font-weight="400" fill="#52606d">id + owner ↔ jobs.photo_id + owner</text><text x="670" y="573" font-size="15" font-weight="400" fill="#52606d">같은 DB 안의 복합 외래키</text><path d="M450,535 L650,535" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="558.0" y="528.0" font-size="13" font-weight="400" fill="#475569">FK 참조</text><path d="M30,541 L15,541" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M15,541 L15,236" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M15,236 L30,158" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="34" y="445" font-size="14" font-weight="400" fill="#52606d">poiId·버전 값만 보존</text><rect x="30" y="704" width="420" height="92" rx="12" fill="white" stroke="#ccd4d9"/><text x="48" y="735" font-size="18" font-weight="700" fill="#15212c">응답 trip · 연결 장소 표시</text><text x="48" y="763" font-size="14" font-weight="400" fill="#52606d">문자열 → JSON 객체 / owner별 이력 조회</text><path d="M240,596 L240,704" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="248.0" y="643.0" font-size="13" font-weight="400" fill="#475569">복원</text><rect x="650" y="704" width="460" height="92" rx="12" fill="white" stroke="#ccd4d9"/><text x="668" y="735" font-size="18" font-weight="700" fill="#15212c">개인 파일 · 사진과 MP4</text><text x="668" y="763" font-size="14" font-weight="400" fill="#52606d">CPU FFmpeg / 보호된 재생 API</text><path d="M880,596 L880,704" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="888.0" y="643.0" font-size="13" font-weight="400" fill="#475569">사진 ID로 처리</text></g></svg>