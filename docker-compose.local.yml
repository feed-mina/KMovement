# ── 로컬 테스트용 (GPU 없음 — TorchServe 제외) ──────────────────────────────
# 사용법:
#   docker compose -f docker-compose.local.yml build
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml logs -f fastapi
#   docker compose -f docker-compose.local.yml down
#
# Redis DB 번호 규약:
#   DB 0 — Spring Boot (공유 Redis 배포 시 cache, token, OAuth, location)
#   DB 1 — FastAPI Celery broker / result backend
# 로컬 SDUI compose는 별도 Redis를 사용하며 기본 호스트 포트 6380을 사용한다.

services:
  # ── FastAPI (K-Ride AI) ──────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: kride_fastapi
    ports:
      - "8000:8000"
    depends_on:
      chromadb:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TORCHSERVE_URL=http://host.docker.internal:8085
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - HF_HOME=/tmp/hf_cache
      - TRANSFORMERS_CACHE=/tmp/hf_cache/hub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── ChromaDB ─────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: kride_chromadb
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kride_redis
    ports:
      - "${KRIDE_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Celery ML Worker (CPU) ─────────────────────────────────────────────
  celery-ml-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kride_celery_ml
    command: celery -A src.api.celery_app worker -l info -c 2 -Q ml
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TORCHSERVE_URL=http://host.docker.internal:8085
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - HF_HOME=/tmp/hf_cache
      - TRANSFORMERS_CACHE=/tmp/hf_cache/hub
    restart: unless-stopped

  # ── Celery Media Worker (CPU) ──────────────────────────────────────────
  celery-media-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kride_celery_media
    command: celery -A src.api.celery_app worker -l info -c 1 -Q media
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - TORCHSERVE_URL=http://host.docker.internal:8085
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_MEDIA_TEMP_DIR=/tmp/kride-celery
      - CELERY_TEMP_TTL_HOURS=${CELERY_TEMP_TTL_HOURS:-6}
      - HF_HOME=/tmp/hf_cache
      - TRANSFORMERS_CACHE=/tmp/hf_cache/hub
    volumes:
      - celery_media_temp:/tmp/kride-celery
      - tora_ffmpeg_temp:/app/.tmp-tora-ffmpeg
      - tora_meta_temp:/app/.tmp-tora-meta
    restart: unless-stopped

  # ── Celery Beat (단일 스케줄러) ────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kride_celery_beat
    command: celery -A src.api.celery_app beat -l info --schedule=/tmp/celerybeat/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - celery_beat_data:/tmp/celerybeat
    restart: unless-stopped

  # ── Flower (Celery 모니터링 대시보드) ───────────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: kride_flower
    command: celery -A src.api.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  celery_media_temp:
  celery_beat_data:
  tora_ffmpeg_temp:
  tora_meta_temp:
